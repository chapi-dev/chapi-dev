<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AGENT SYSTEMS / AI THAT LEAVES THE LAB.</title>
  <desc id="description">One agent, four deployment architectures. A connected graph of four runtimes around an agent core.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6574a1" stop-opacity=".55"/><stop offset=".5" stop-color="#22304c" stop-opacity=".3"/><stop offset="1" stop-color="#5ce4cf" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#fff"/><stop offset=".48" stop-color="#e0dcff"/><stop offset="1" stop-color="#7cf5d2"/>
    </linearGradient>
    <radialGradient id="atmosphere">
      <stop stop-color="#4f46a8" stop-opacity=".34"/><stop offset="1" stop-color="#4f46a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx=".35" cy=".25" r=".8">
      <stop stop-color="#193344"/><stop offset=".55" stop-color="#0b1d2c"/><stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b4a1ff"/><stop offset=".5" stop-color="#63cde8"/><stop offset="1" stop-color="#78ffce"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#647ba6" stroke-opacity=".065"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="260" rx="24"/></clipPath>
    <radialGradient id="card-glow"><stop stop-color="#8bf0d0" stop-opacity=".13"/><stop offset="1" stop-color="#8bf0d0" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; }
    .orbit { animation: orbit 60s linear infinite; }
    .reverse { animation: orbit 85s linear infinite reverse; }
    .beacon { animation: beacon 4s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes beacon { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .reverse, .beacon { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="260" fill="#080d19"/>
    <rect width="600" height="260" fill="url(#grid)"/>
    <ellipse cx="495" cy="130" rx="210" ry="195" fill="url(#card-glow)"/>
    <path d="M28 52H51" stroke="#8bf0d0" stroke-width="2"/>
    <text x="62" y="56" fill="#8bf0d0" font-size="11" class="mono" letter-spacing="1.4">AGENT SYSTEMS</text>
    <text x="28" y="122" fill="#f1f5ff" font-size="34" font-weight="750" letter-spacing="-1">AI THAT</text>
    <text x="28" y="165" fill="#f1f5ff" font-size="34" font-weight="750" letter-spacing="-1">LEAVES THE LAB.</text>
    <text x="30" y="229" fill="#8d9cb7" font-size="11" class="mono" letter-spacing="1.6">EXPERIMENT 01</text>
    <path d="M554 222H573 M565 214L573 222L565 230" stroke="#8bf0d0" stroke-width="1.5"/>
    <g transform="translate(463 137)">
  <path d="M-60 -51L0 0L60 -51 M-60 51L0 0L60 51" stroke="#81e8cd" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="M-60 -51H60V51H-60Z" stroke="#81e8cd" stroke-opacity=".17" stroke-dasharray="3 7"/>
  <rect x="-73" y="-64" width="26" height="26" rx="7" fill="#102c2c" stroke="#83d9cb" stroke-opacity=".7"/><circle cx="-60" cy="-51" r="3" fill="#9cf6dd"/><rect x="47" y="-64" width="26" height="26" rx="7" fill="#102c2c" stroke="#83d9cb" stroke-opacity=".7"/><circle cx="60" cy="-51" r="3" fill="#9cf6dd"/><rect x="-73" y="38" width="26" height="26" rx="7" fill="#102c2c" stroke="#83d9cb" stroke-opacity=".7"/><circle cx="-60" cy="51" r="3" fill="#9cf6dd"/><rect x="47" y="38" width="26" height="26" rx="7" fill="#102c2c" stroke="#83d9cb" stroke-opacity=".7"/><circle cx="60" cy="51" r="3" fill="#9cf6dd"/>
  <rect x="-24" y="-24" width="48" height="48" rx="13" fill="#102a2b" stroke="#96ffe1"/>
  <path d="M-10 0H10 M0 -10V10" stroke="#bcfff0" stroke-width="2"/>
  <circle r="37" stroke="#87f3d0" stroke-opacity=".25" stroke-dasharray="2 6" class="orbit"/>
</g>
    <rect x=".5" y=".5" width="599" height="259" rx="23.5" stroke="url(#edge)"/>
  </g>
</svg>
